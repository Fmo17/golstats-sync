name: Sync de odds (2x ao dia)

on:
  schedule:
    # 08:00 UTC = 05:00 Brasília
    - cron: '0 8 * * *'
    # 18:00 UTC = 15:00 Brasília
    - cron: '0 18 * * *'
  workflow_dispatch: {}

# Mesmo grupo do workflow de resultados -- impede os 2 workflows de
# rodarem ao mesmo tempo (eles coincidem às 08h e 18h UTC), não só
# execuções duplicadas do mesmo workflow
concurrency:
  group: golstats-api-pipeline
  cancel-in-progress: false

jobs:
  sync-odds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar odds dos próximos 5 dias, todas as ligas
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/sync-odds.js --dias=5 --limite=1000 --pausa=500

      - name: Gerar sinais sombra Dupla 1X (experimento isolado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/gerar-sinais-sombra-1x.js

      - name: Reclassificar valor com as odds atualizadas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/encontrar-valor.js
