name: Atualizar resultados (a cada 2h)

on:
  schedule:
    # A cada 2 horas, o dia inteiro -- pega jogos que acabaram de terminar,
    # sem esperar a rotina completa da madrugada. Não mexe em estatísticas
    # (posse/finalizações/etc) nem odds -- só jogos/resultado/sinais, que é
    # rápido e barato (poucas requisições).
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

# Impede que 2 execuções desse workflow rodem ao mesmo tempo
concurrency:
  group: atualizar-resultados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Sincronizar jogos (traz placar e status atualizado)
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/sync.js

      - name: Corrigir jogos "agendados" presos no passado
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/sync.js --corrigir-agendados

      - name: Verificar sinais contra resultados reais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/verificar-sinais.js

      - name: Liquidar sinais sombra Dupla 1X (experimento isolado)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/liquidar-sinais-sombra-1x.js
